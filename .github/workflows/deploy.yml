# 소유: 클라이언트·배포 부서 (ADR-002).
# PR → 미리보기, main → 스테이징(main.wildlife-of-bird.pages.dev), 태그 v* → 프로덕션.
name: Deploy

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: wildlife-of-bird

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 비밀값 확인
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN이 없어 배포를 건너뛴다 (대표 작업 #60)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 빌드
        run: npm run build -w @wb/web

      - name: Pages 브랜치 정하기
        id: target
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "branch=production" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "branch=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Pages 프로젝트 만들기 (처음 한 번)
        if: steps.secrets.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx --yes wrangler@4 pages project list | grep -qw "$PROJECT"; then
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=production
          fi

      - name: 배포
        id: deploy
        if: steps.secrets.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=${{ env.PROJECT }} --branch=${{ steps.target.outputs.branch }} --commit-dirty=true

      - name: PR에 주소 남기기
        if: steps.secrets.outputs.ok == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "미리보기: ${ALIAS:-$URL} (이번 커밋: $URL)"
